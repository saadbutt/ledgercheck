name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install dependencies
        run: pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check .
      - name: Validate the committed corpus
        run: python -m ledgercheck.cli validate --root corpus
      - name: Rebuild and confirm nothing changed
        run: |
          python -m ledgercheck.cli build --root corpus
          git diff --exit-code -- corpus/extraction_truth.json corpus/expected_decisions.json corpus/card_statement.json corpus/corpus.json
      - name: Tests
        run: python -m unittest discover -s tests -t . -v
