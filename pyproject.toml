[project]
name = "ledgercheck"
version = "0.1.0"
description = "A scored corpus of ecommerce bookkeeping documents, and the invariants that keep it honest."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["reportlab>=4.0", "pdf2image>=1.16", "pillow>=10.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ledgercheck*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
